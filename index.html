<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>공사 구축 캘린더</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 헤더 -->
  <div class="header">
    <div class="header-content">
      <h1>📅 공사 구축 캘린더</h1>
      <p>프로젝트 일정 관리</p>
    </div>
  </div>

  <!-- 메인 컨테이너 -->
  <div class="container">
    <div class="main-grid">
      <!-- 캘린더 영역 -->
      <div>
        <!-- 탭 -->
        <div class="tabs">
          <button class="tab-btn active" onclick="switchView('month')">📅 월간</button>
          <button class="tab-btn" onclick="switchView('week')">📆 주간</button>
          <button class="tab-btn" onclick="switchView('day')">📍 일일</button>
        </div>

        <!-- 네비게이션 -->
        <div class="nav-bar">
          <button class="nav-btn" onclick="prevMonth()">◀</button>
          <div class="nav-title" id="monthTitle">2026년 9월</div>
          <button class="nav-btn" onclick="nextMonth()">▶</button>
        </div>

        <!-- 캘린더 -->
        <div class="calendar-container">
          <div id="monthView" class="calendar-grid"></div>
          <div id="weekView" class="week-grid hidden"></div>
          <div id="dayView" class="day-view hidden"></div>
        </div>
      </div>

      <!-- 사이드바 -->
      <div class="sidebar">
        <!-- 카테고리 -->
        <div class="card">
          <h3>🏷️ 카테고리</h3>
          <div class="category-list" id="categoryList"></div>
        </div>

        <!-- 입력폼 -->
        <div class="card">
          <h3>➕ 일정 추가</h3>
          <form onsubmit="addEvent(event)">
            <div class="form-group">
              <label class="form-label">카테고리</label>
              <select id="categorySelect" class="form-select">
                <option value="inbound">인바운드 인입</option>
                <option value="intro">소개서 전달</option>
                <option value="contract_delivery">계약서 전달</option>
                <option value="contract_send">계약서 송부</option>
                <option value="terminal_work">단말기 공사</option>
                <option value="linkage">연동 진행</option>
              </select>
            </div>

            <div class="form-group">
              <label class="form-label">시작일</label>
              <input type="number" id="startDay" class="form-input" min="1" max="31" value="1" required>
            </div>

            <div class="form-group">
              <label class="form-label">기간 (일)</label>
              <input type="number" id="duration" class="form-input" min="1" max="31" value="3" required>
            </div>

            <button type="submit" class="submit-btn">추가하기</button>
          </form>

          <div id="eventListSection" class="event-list-section hidden">
            <h4>📝 추가된 일정</h4>
            <div class="event-items" id="eventList"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
